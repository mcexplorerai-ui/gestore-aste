<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestore Aste Immobiliari</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #222222;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ede8;
  --text2: #888880;
  --text3: #555550;
  --accent: #c8a96e;
  --accent2: #8a6f3e;
  --red: #e05252;
  --red-bg: rgba(224,82,82,0.12);
  --green: #5a9e6f;
  --green-bg: rgba(90,158,111,0.12);
  --amber: #c8933a;
  --amber-bg: rgba(200,147,58,0.12);
  --blue: #5a8ec8;
  --blue-bg: rgba(90,142,200,0.12);
  --radius: 10px;
  --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); }

/* Layout */
.shell { max-width: 980px; margin: 0 auto; padding: 2rem 1.5rem; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 12px; flex-wrap: wrap; }
.logo { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; }
.logo span { color: var(--text2); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 1.5rem; }
.stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.stat-val { font-size: 26px; font-weight: 500; color: var(--text); font-family: 'DM Mono', monospace; }
.stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; letter-spacing: 0.05em; text-transform: uppercase; }

/* Alert banner */
.alert-banner { background: var(--red-bg); border: 0.5px solid rgba(224,82,82,0.3); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 1.5rem; font-size: 13px; color: var(--red); display: none; line-height: 1.6; }

/* Toolbar */
.toolbar { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
.toolbar input[type=text] { flex: 1; min-width: 200px; background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 14px; outline: none; }
.toolbar input[type=text]:focus { border-color: var(--accent); }
.toolbar select { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 9px 12px; outline: none; cursor: pointer; }
.btn { padding: 9px 16px; font-size: 13px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; background: transparent; color: var(--text); font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap; }
.btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
.btn-accent { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 500; }
.btn-accent:hover { background: #d4b87a; color: #0f0f0f; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-ghost { border-color: transparent; color: var(--text2); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }

/* Cards */
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 10px; transition: border-color 0.2s; }
.card:hover { border-color: var(--border2); }
.card.alert-on { border-left: 2.5px solid var(--red); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.card-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
.price { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--accent); white-space: nowrap; }
.price-lbl { font-size: 11px; color: var(--text3); text-align: right; margin-top: 2px; }

/* Badges */
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; border: 0.5px solid transparent; white-space: nowrap; font-family: 'DM Mono', monospace; letter-spacing: 0.03em; }
.b-gray { background: var(--surface2); color: var(--text2); border-color: var(--border2); }
.b-red { background: var(--red-bg); color: var(--red); border-color: rgba(224,82,82,0.25); }
.b-green { background: var(--green-bg); color: var(--green); border-color: rgba(90,158,111,0.25); }
.b-amber { background: var(--amber-bg); color: var(--amber); border-color: rgba(200,147,58,0.25); }
.b-blue { background: var(--blue-bg); color: var(--blue); border-color: rgba(90,142,200,0.25); }

/* Note */
.note-box { background: var(--surface2); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--text); margin-bottom: 10px; border-left: 2px solid var(--accent2); line-height: 1.6; }

/* Alert msg */
.alert-msg { background: var(--red-bg); border-radius: var(--radius); padding: 8px 12px; font-size: 12px; color: var(--red); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

/* Stars */
.stars-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.stars { display: flex; gap: 2px; }
.star { width: 16px; height: 16px; cursor: pointer; border-radius: 50%; background: var(--surface2); border: 0.5px solid var(--border2); transition: all 0.1s; display: inline-block; }
.star.on { background: var(--amber); border-color: var(--amber); }
.star:hover { border-color: var(--amber); }
.voto-lbl { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }

/* Card actions */
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Empty */
.empty { text-align: center; padding: 4rem 1rem; color: var(--text2); font-size: 14px; }
.empty p { margin-top: 8px; font-size: 13px; color: var(--text3); }

/* Modal */
.modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
.modal { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 1.75rem; width: 500px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; color: var(--text); }
.form-row { margin-bottom: 14px; }
.form-row label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 5px; letter-spacing: 0.08em; text-transform: uppercase; }
.form-row input, .form-row textarea, .form-row select {
  width: 100%; padding: 9px 12px; font-size: 14px;
  border: 0.5px solid var(--border2); border-radius: var(--radius);
  background: var(--surface2); color: var(--text);
  font-family: 'DM Sans', sans-serif; outline: none;
}
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); }
.form-row textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.form-row select option { background: #222; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; flex-wrap: wrap; }
.toggle-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; }
.toggle-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

/* Alert dot */
.alert-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div>
      <div class="logo">MC Freedom <span>/</span> Gestore Aste</div>
      <div style="font-size:12px;color:var(--text3);margin-top:3px;font-family:'DM Mono',monospace;">v1.0 — dati salvati nel browser</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="importData()">Importa JSON</button>
      <button class="btn" onclick="exportData()">Esporta JSON</button>
      <button class="btn btn-accent" onclick="openModal('new')">+ Nuova asta</button>
    </div>
  </div>

  <div id="alert-banner" class="alert-banner"></div>

  <div class="stats" id="stats-row"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Cerca indirizzo, città, tribunale..." oninput="renderList()" />
    <select id="f-voto" onchange="renderList()">
      <option value="">Tutti i voti</option>
      <option value="8">8–10 Ottimo</option>
      <option value="6">6–7 Buono</option>
      <option value="1">Sotto 6</option>
      <option value="0">Non votate</option>
    </select>
    <select id="f-stato" onchange="renderList()">
      <option value="">Tutti gli stati</option>
      <option value="da_analizzare">Da analizzare</option>
      <option value="analizzata">Analizzata</option>
      <option value="interesse">In interesse</option>
      <option value="offerta">Offerta fatta</option>
      <option value="scartata">Scartata</option>
    </select>
    <select id="f-alert" onchange="renderList()">
      <option value="">Tutti</option>
      <option value="1">Solo con alert</option>
    </select>
  </div>

  <div id="list-container"></div>
</div>

<div id="modal-container"></div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)" />

<script>
const STATI = {
  da_analizzare: { label: 'Da analizzare', cls: 'b-gray' },
  analizzata:    { label: 'Analizzata',    cls: 'b-blue' },
  interesse:     { label: 'In interesse',  cls: 'b-green' },
  offerta:       { label: 'Offerta fatta', cls: 'b-amber' },
  scartata:      { label: 'Scartata',      cls: 'b-red' }
};

let aste = [];

function loadData() {
  try {
    const r = localStorage.getItem('mc_aste_v1');
    if (r) aste = JSON.parse(r);
  } catch(e) {}
  if (!aste.length) seedDemo();
}

function saveData() {
  try { localStorage.setItem('mc_aste_v1', JSON.stringify(aste)); } catch(e) {}
}

function seedDemo() {
  aste = [
    {
      id: 1001, titolo: 'Appartamento Via Romagnosi',
      citta: 'Firenze', indirizzo: 'Via G. Romagnosi 13',
      prezzo_base: 182000, tribunale: 'Tribunale di Firenze',
      procedura: 'R.G. 219/2022', data_udienza: '2026-06-23',
      stato: 'analizzata', voto: 6,
      note: 'Piano 4° senza ascensore. Urbanistica pulita. Occupato da familiari del debitore — verificare stato possesso con custode IS.Ve.g prima di offrire. Offerta max consigliata €155k se libero.',
      alert: true, alert_data: '2026-06-10', alert_msg: 'Chiamare IS.Ve.g Firenze (055 2340830) — verificare rilascio occupanti',
      tag: ['Firenze', '4° piano', 'No ascensore'], creato: '2026-06-05'
    },
    {
      id: 1002, titolo: 'Colonico Via del Terzo',
      citta: 'Monsummano Terme', indirizzo: 'Via del Terzo 442',
      prezzo_base: 57000, tribunale: 'Tribunale di Pistoia',
      procedura: 'R.G.E. 186/2024', data_udienza: '2026-07-15',
      stato: 'scartata', voto: 2,
      note: 'SCARTATA. Conto in rosso in qualsiasi scenario. Difformità non sanabili, nessun allaccio acquedotto/fognatura, umidità di risalita. 3° tentativo senza offerenti.',
      alert: false, alert_data: '', alert_msg: '',
      tag: ['Monsummano', 'Colonico', 'Criticità gravi'], creato: '2026-06-05'
    }
  ];
  saveData();
}

function fmt(n) {
  return n ? Number(n).toLocaleString('it-IT') : '0';
}

function getVotoColor(v) {
  if (!v) return 'b-gray';
  if (v >= 8) return 'b-green';
  if (v >= 6) return 'b-blue';
  if (v >= 4) return 'b-amber';
  return 'b-red';
}

function getVotoLabel(v) {
  if (!v) return 'Non votata';
  if (v >= 8) return v + '/10 ★ Ottimo';
  if (v >= 6) return v + '/10 Buono';
  if (v >= 4) return v + '/10 Discreto';
  return v + '/10 Scarso';
}

function renderStars(id, voto) {
  let h = '<div class="stars">';
  for (let i = 1; i <= 10; i++) {
    h += '<span class="star' + (i <= voto ? ' on' : '') + '" onclick="setVoto(' + id + ',' + i + ')" title="' + i + '/10"></span>';
  }
  return h + '</div>';
}

function setVoto(id, v) {
  const a = aste.find(x => x.id === id);
  if (!a) return;
  a.voto = (a.voto === v) ? 0 : v;
  saveData(); renderList();
}

function renderStats() {
  const tot = aste.length;
  const int = aste.filter(a => a.stato === 'interesse' || a.stato === 'offerta').length;
  const alr = aste.filter(a => a.alert).length;
  const vot = aste.filter(a => a.voto > 0);
  const med = vot.length ? (vot.reduce((s,a) => s+a.voto,0)/vot.length).toFixed(1) : '—';
  document.getElementById('stats-row').innerHTML =
    s('Totale aste', tot) + s('Da seguire', int) + s('Alert attivi', alr) + s('Voto medio', med);
}

function s(l, v) {
  return '<div class="stat"><div class="stat-val">' + v + '</div><div class="stat-lbl">' + l + '</div></div>';
}

function checkAlerts() {
  const oggi = new Date().toISOString().slice(0,10);
  const attivi = aste.filter(a => a.alert && a.alert_data && a.alert_data <= oggi);
  const b = document.getElementById('alert-banner');
  if (attivi.length) {
    b.style.display = 'block';
    b.innerHTML = '⚠ ' + attivi.length + ' alert ' + (attivi.length === 1 ? 'attivo' : 'attivi') + ':  ' +
      attivi.map(a => '<strong>' + a.titolo + '</strong> — ' + (a.alert_msg || 'Scadenza alert')).join('  •  ');
  } else {
    b.style.display = 'none';
  }
}

function renderList() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const fv = document.getElementById('f-voto').value;
  const fs = document.getElementById('f-stato').value;
  const fa = document.getElementById('f-alert').value;

  let list = aste.filter(a => {
    if (q && !([a.titolo,a.citta,a.indirizzo,a.tribunale,a.procedura].join(' ').toLowerCase().includes(q))) return false;
    if (fs && a.stato !== fs) return false;
    if (fa === '1' && !a.alert) return false;
    if (fv === '0' && a.voto > 0) return false;
    if (fv === '8' && a.voto < 8) return false;
    if (fv === '6' && (a.voto < 6 || a.voto >= 8)) return false;
    if (fv === '1' && (a.voto <= 0 || a.voto >= 6)) return false;
    return true;
  }).sort((a,b) => b.id - a.id);

  const c = document.getElementById('list-container');
  if (!list.length) {
    c.innerHTML = '<div class="empty"><div style="font-size:32px;">◎</div><p>Nessuna asta trovata. Clicca "+ Nuova asta" per iniziare.</p></div>';
    renderStats();
    return;
  }
  c.innerHTML = list.map(a => cardHtml(a)).join('');
  renderStats();
}

function cardHtml(a) {
  const st = STATI[a.stato] || STATI['da_analizzare'];
  const ud = a.data_udienza;
  let udLabel = '', udCls = 'b-gray';
  if (ud) {
    const diff = Math.ceil((new Date(ud) - new Date()) / 86400000);
    const dateStr = ud.split('-').reverse().join('/');
    if (diff < 0) { udLabel = dateStr + ' (scaduta)'; udCls = 'b-red'; }
    else if (diff === 0) { udLabel = 'Udienza OGGI!'; udCls = 'b-red'; }
    else if (diff <= 7) { udLabel = dateStr + ' (' + diff + 'gg)'; udCls = 'b-amber'; }
    else { udLabel = dateStr + ' (' + diff + 'gg)'; }
  }

  return `<div class="card${a.alert ? ' alert-on' : ''}">
    <div class="card-top">
      <div style="flex:1;min-width:0;">
        <div class="card-title">
          ${a.alert ? '<span class="alert-dot"></span>' : ''}
          ${esc(a.titolo)}
        </div>
        <div class="card-sub">${esc(a.indirizzo||'')}${a.indirizzo && a.citta ? ' · ' : ''}${esc(a.citta||'')}${a.procedura ? '  ·  ' + esc(a.procedura) : ''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="price">€ ${fmt(a.prezzo_base)}</div>
        <div class="price-lbl">prezzo base</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge ${st.cls}">${st.label}</span>
      <span class="badge ${getVotoColor(a.voto)}">${getVotoLabel(a.voto)}</span>
      ${udLabel ? '<span class="badge ' + udCls + '">' + udLabel + '</span>' : ''}
      ${a.alert ? '<span class="badge b-red">⚠ alert ' + (a.alert_data ? a.alert_data.split('-').reverse().join('/') : '') + '</span>' : ''}
      ${(a.tag||[]).map(t => '<span class="badge b-gray">' + esc(t) + '</span>').join('')}
    </div>
    ${a.note ? '<div class="note-box">' + esc(a.note) + '</div>' : ''}
    ${a.alert && a.alert_msg ? '<div class="alert-msg">⚠ ' + esc(a.alert_msg) + '</div>' : ''}
    <div class="stars-row">
      <span style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;">Voto</span>
      ${renderStars(a.id, a.voto||0)}
      <span class="voto-lbl">${a.voto ? a.voto + '/10' : '—'}</span>
    </div>
    <div class="card-actions">
      <button class="btn btn-sm" onclick="openModal('edit',${a.id})">Modifica</button>
      <button class="btn btn-sm" onclick="openModal('note',${a.id})">Nota rapida</button>
      <button class="btn btn-sm" onclick="openModal('alert',${a.id})">${a.alert ? 'Modifica alert' : '+ Alert'}</button>
      <button class="btn btn-sm btn-ghost" onclick="eliminaAsta(${a.id})" style="margin-left:auto;">Elimina</button>
    </div>
  </div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(tipo, id) {
  const a = id ? aste.find(x => x.id === id) : null;
  let html = '';

  if (tipo === 'new' || tipo === 'edit') {
    html = `<div class="modal" onclick="event.stopPropagation()">
      <h3>${tipo === 'new' ? 'Nuova asta' : 'Modifica — ' + esc(a?.titolo||'')}</h3>
      <div class="form-row"><label>Titolo identificativo</label><input id="f-titolo" value="${esc(a?.titolo||'')}" placeholder="es. Trilocale Via Roma, Firenze" /></div>
      <div class="form-grid">
        <div class="form-row"><label>Città</label><input id="f-citta" value="${esc(a?.citta||'')}" /></div>
        <div class="form-row"><label>Indirizzo</label><input id="f-indirizzo" value="${esc(a?.indirizzo||'')}" /></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Prezzo base (€)</label><input id="f-prezzo" type="number" value="${a?.prezzo_base||''}" /></div>
        <div class="form-row"><label>Data udienza</label><input id="f-udienza" type="date" value="${a?.data_udienza||''}" /></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Tribunale</label><input id="f-tribunale" value="${esc(a?.tribunale||'')}" /></div>
        <div class="form-row"><label>N. procedura</label><input id="f-procedura" value="${esc(a?.procedura||'')}" /></div>
      </div>
      <div class="form-row"><label>Stato</label>
        <select id="f-stato">${Object.entries(STATI).map(([k,v]) => '<option value="'+k+'"'+(a?.stato===k?' selected':'')+'>'+v.label+'</option>').join('')}</select>
      </div>
      <div class="form-row"><label>Tag (separati da virgola)</label><input id="f-tag" value="${esc((a?.tag||[]).join(', '))}" placeholder="es. Firenze, Bilocale, Prima casa" /></div>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn btn-accent" onclick="salvaAsta(${id||'null'})">${tipo === 'new' ? 'Aggiungi asta' : 'Salva modifiche'}</button>
      </div>
    </div>`;
  } else if (tipo === 'note') {
    html = `<div class="modal" onclick="event.stopPropagation()">
      <h3>Nota rapida — ${esc(a?.titolo||'')}</h3>
      <p style="font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6;">La nota appare direttamente sulla card, visibile senza aprire l'analisi.</p>
      <div class="form-row"><textarea id="f-note" rows="5" placeholder="es. Verificare stato occupazione. Margine interessante se aggiudicazione sotto €130k. Contattare custode entro il 10/06.">${esc(a?.note||'')}</textarea></div>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        ${a?.note ? '<button class="btn btn-ghost" onclick="salvaNota('+id+', true)">Cancella nota</button>' : ''}
        <button class="btn btn-accent" onclick="salvaNota(${id}, false)">Salva nota</button>
      </div>
    </div>`;
  } else if (tipo === 'alert') {
    html = `<div class="modal" onclick="event.stopPropagation()">
      <h3>Alert personalizzato — ${esc(a?.titolo||'')}</h3>
      <div class="form-row">
        <label class="toggle-row"><input type="checkbox" id="f-alert-on" ${a?.alert?'checked':''}> Attiva alert per questa asta</label>
      </div>
      <div class="form-row"><label>Data di notifica</label><input id="f-alert-data" type="date" value="${a?.alert_data||''}" /></div>
      <div class="form-row"><label>Messaggio alert (visibile sul banner e sulla card)</label>
        <textarea id="f-alert-msg" rows="3" placeholder="es. Verificare con custode lo stato di possesso. Termine offerte fra 7 giorni.">${esc(a?.alert_msg||'')}</textarea>
      </div>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        ${a?.alert ? '<button class="btn btn-ghost" onclick="rimuoviAlert('+id+')">Rimuovi alert</button>' : ''}
        <button class="btn btn-accent" onclick="salvaAlert(${id})">Salva alert</button>
      </div>
    </div>`;
  }

  document.getElementById('modal-container').innerHTML =
    '<div class="modal-bg" onclick="closeModal()">' + html + '</div>';
}

function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function salvaAsta(id) {
  const titolo = (document.getElementById('f-titolo').value||'').trim();
  if (!titolo) { alert('Inserisci almeno il titolo'); return; }
  const obj = {
    titolo,
    citta: (document.getElementById('f-citta').value||'').trim(),
    indirizzo: (document.getElementById('f-indirizzo').value||'').trim(),
    prezzo_base: parseInt(document.getElementById('f-prezzo').value)||0,
    data_udienza: document.getElementById('f-udienza').value,
    tribunale: (document.getElementById('f-tribunale').value||'').trim(),
    procedura: (document.getElementById('f-procedura').value||'').trim(),
    stato: document.getElementById('f-stato').value,
    tag: (document.getElementById('f-tag').value||'').split(',').map(t=>t.trim()).filter(Boolean)
  };
  if (id) {
    const idx = aste.findIndex(x => x.id === id);
    if (idx >= 0) aste[idx] = { ...aste[idx], ...obj };
  } else {
    aste.unshift({ id: Date.now(), ...obj, voto:0, note:'', alert:false, alert_data:'', alert_msg:'', creato: new Date().toISOString().slice(0,10) });
  }
  saveData(); closeModal(); renderList(); checkAlerts();
}

function salvaNota(id, cancella) {
  const a = aste.find(x => x.id === id);
  if (a) { a.note = cancella ? '' : (document.getElementById('f-note').value||'').trim(); saveData(); }
  closeModal(); renderList();
}

function salvaAlert(id) {
  const a = aste.find(x => x.id === id);
  if (a) {
    a.alert = document.getElementById('f-alert-on').checked;
    a.alert_data = document.getElementById('f-alert-data').value;
    a.alert_msg = (document.getElementById('f-alert-msg').value||'').trim();
    saveData();
  }
  closeModal(); renderList(); checkAlerts();
}

function rimuoviAlert(id) {
  const a = aste.find(x => x.id === id);
  if (a) { a.alert = false; a.alert_data = ''; a.alert_msg = ''; saveData(); }
  closeModal(); renderList(); checkAlerts();
}

function eliminaAsta(id) {
  const a = aste.find(x => x.id === id);
  if (!a) return;
  if (!confirm('Eliminare "' + a.titolo + '" dal gestore?')) return;
  aste = aste.filter(x => x.id !== id);
  saveData(); renderList(); checkAlerts();
}

function exportData() {
  const blob = new Blob([JSON.stringify(aste, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = url; el.download = 'aste_' + new Date().toISOString().slice(0,10) + '.json';
  el.click(); URL.revokeObjectURL(url);
}

function importData() { document.getElementById('import-input').click(); }

function handleImport(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) { alert('File JSON non valido'); return; }
      if (confirm('Importare ' + imported.length + ' aste? I dati esistenti verranno mantenuti (le aste duplicate verranno saltate).')) {
        const ids = new Set(aste.map(a => a.id));
        imported.forEach(a => { if (!ids.has(a.id)) aste.push(a); });
        saveData(); renderList(); checkAlerts();
      }
    } catch(err) { alert('Errore nel file JSON: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
}

loadData();
checkAlerts();
renderList();
</script>
</body>
</html>
